# Fangmanle PMS · Docker (includes 03_demo sample data)
#
# From repo root (no root .env required):
#   docker compose -f deploy/docker/docker-compose.seed.yml up -d --build
#
# Edit this file to change hotel, passwords, ports, or map keys.
# Demo defaults below are for local try-out. Change them before production.

services:
  db:
    image: postgres:16-alpine
    container_name: fangmanle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fangmanle
      POSTGRES_PASSWORD: change-me-in-production
      POSTGRES_DB: fangmanle
      FML_DB_ROOT: /db
      FML_DB_SKIP_DEMO: "0"
      FML_ADMIN_USERNAME: admin
      FML_ADMIN_PASSWORD: admin123
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../db:/db:ro
      - ../../db/postgres/docker-init.sh:/docker-entrypoint-initdb.d/01_apply.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  pms:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: fangmanle-pms:1.0.0
    container_name: fangmanle-pms
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://fangmanle:change-me-in-production@db:5432/fangmanle
      FML_DEPLOY: container
      FML_JWT_SECRET: please-change-this-jwt-secret
      FML_HOST: 0.0.0.0
      FML_PORT: 8000
      # Hotel id: demo-intl / demo-cn / demo-sg / custom (must exist as config/hotels/<id>.yaml)
      FML_HOTEL: demo-intl
      TZ: UTC
      # Optional map keys (leave empty unless you use maps)
      MAP_PROVIDER: tianditu
      TIANDITU_TK: ""
      TIANDITU_JS_TK: ""
      AMAP_KEY: ""
      AMAP_JS_KEY: ""
      AMAP_SECURITY_CODE: ""
    volumes:
      - ../../config:/app/config:ro
      - ../../locales:/app/locales:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
