[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fangmanle-ai-native-pms"
version = "0.1.0"
description = "Self-hosted AI-native hotel PMS: open-source OpenCore (Apache-2.0) plus optional commercial AI (BUSL)"
readme = "README.md"
requires-python = ">=3.11"
# 本仓库是可运行的 PMS 应用，不是可 `pip install` 的库（见下方 packages=[]）。
# 开发：仓库根 `PYTHONPATH=src`，或 `pip install -e ".[postgres,gmssl]"` 只为装依赖。
license = { text = "Apache-2.0 AND LicenseRef-BUSL-1.1" }
authors = [
    { name = "上海感物知行科技有限公司", email = "contact@sensepraxis.com" },
]
keywords = [
    "hotel-pms",
    "pms",
    "hotel",
    "hospitality",
    "open-source",
    "self-hosted",
    "ai-native",
    "ai-agent",
    "property-management-system",
    "revenue-management",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]

dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # 数据层（SQLite 开箱；PostgreSQL 见 extra postgres）
    "sqlalchemy>=2.0",
    # 校验 / 序列化
    "pydantic>=2",
    # 加解密（默认 AES；国密 SM4 见 extra gmssl）
    "cryptography>=42",
    # HTTP 客户端（私域通道 / 外部 API）
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
gmssl = [
    "gmssl>=3.2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[project.urls]
# 上游默认地址。Fork 后请改成你的 Git remote，否则包元数据会指向上游。
Homepage = "https://github.com/sensepraxis/fangmanle-ai-native-pms"
Repository = "https://github.com/sensepraxis/fangmanle-ai-native-pms"
Documentation = "https://github.com/sensepraxis/fangmanle-ai-native-pms#readme"

[tool.setuptools]
# 应用仓库，不是 SDK：不发布可 import 的发行包。运行入口为 src/run_prod.py / uvicorn api:app。
packages = []

# ------------------------- 开发工具配置 -------------------------

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/locales"]

[tool.ruff.lint]
# E/F/I/W: pycodestyle + pyflakes + isort + pycodestyle-warnings
# UP: pyupgrade  (B: flake8-bugbear)
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI 的 Depends() 在默认值中属正常用法

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
# 单测体系：src/tests 下为真正的 pytest 用例（unittest.TestCase 风格 + 函数式集成测试）。
# conftest.py 在会话启动时把 DATABASE_URL 锁定到 SQLite 并灌最小种子，故无需任何外部依赖即可跑通。
# 需要真实后端的集成用例（test_flow.py 等）在无服务时自动 pytest.skip，不阻断 CI。
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "commercial: requires Commercial Core (src/commercial and FML_COMMERCIAL not off)",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/tests/*", "src/scripts/*"]

[tool.coverage.report]
# Policy targets (docs/COVERAGE.md): core ≥60%, public API 100%. Not fail_under until numbers are real.
show_missing = true
