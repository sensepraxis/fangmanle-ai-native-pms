name: Bug
description: 报告缺陷
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认能否用 `FML_COMMERCIAL=0` 在 OpenCore 路径复现。商业 AI 问题请标明走了 LLM。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 期望 vs 实际。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 酒店 YAML / 数据库（SQLite 或 PG）/ 环境变量。
    validations:
      required: true
  - type: dropdown
    id: pack
    attributes:
      label: 路径
      options:
        - OpenCore（无商业包或 FML_COMMERCIAL=0）
        - 含 Commercial Core
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / commit
      description: 例如 0.1.0-alpha 或 git SHA。可跟 CHANGELOG。
    validations:
      required: true
