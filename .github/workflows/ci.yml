name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (lint + test + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt
          pip install pytest pytest-cov ruff

      - name: Ruff
        run: |
          ruff check src
          ruff format --check src tools

      - name: Router layer (no direct commercial import)
        run: python tools/check_router_layer.py

      - name: SPDX headers
        run: python tools/check_spdx.py

      - name: Pytest + coverage
        env:
          DATABASE_URL: "sqlite:///./tmp/ci_test.db"
        run: |
          mkdir -p tmp
          pytest src/tests --cov=src --cov-report=term --cov-report=xml

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: i18n catalog check
        run: python tools/i18n_catalog.py --check

      - name: i18n health
        run: python tools/i18n_optimize.py --check

      - name: Export OpenAPI
        env:
          DATABASE_URL: "sqlite:///./tmp/ci_openapi.db"
          PYTHONPATH: src
        run: python tools/export_openapi.py

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-json
          path: docs/openapi.json
          if-no-files-found: ignore

  opencore-smoke:
    name: OpenCore-only (FML_COMMERCIAL=0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt
          pip install pytest

      - name: Smoke
        env:
          FML_COMMERCIAL: "0"
          DATABASE_URL: "sqlite:///./tmp/ci_opencore.db"
        run: |
          mkdir -p tmp
          python tools/ci_opencore_smoke.py

      - name: Pytest OpenCore matrix
        env:
          FML_COMMERCIAL: "0"
          DATABASE_URL: "sqlite:///./tmp/ci_opencore_pytest.db"
        run: |
          mkdir -p tmp
          pytest -q -m "not commercial"

      - name: Smoke after removing src/commercial
        env:
          FML_COMMERCIAL: "1"
          FML_OPENCORE_NODIR: "1"
          DATABASE_URL: "sqlite:///./tmp/ci_opencore_nodir.db"
        run: |
          mkdir -p tmp
          rm -rf src/commercial
          python tools/ci_opencore_smoke.py

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: commercialEnabled gate
        working-directory: .
        run: python tools/check_commercial_ui.py

      - name: ESLint + Prettier
        run: |
          npm run lint
          npm run format:check

      - name: vue-tsc
        run: npm run typecheck

      - name: vite build
        run: npm run build
