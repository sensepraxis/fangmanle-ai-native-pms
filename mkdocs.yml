# SPDX-License-Identifier: Apache-2.0
site_name: Fangmanle PMS
site_description: Self-hosted AI-native hotel PMS — open-source OpenCore plus optional commercial AI
site_url: https://sensepraxis.github.io/fangmanle-ai-native-pms/
repo_url: https://github.com/sensepraxis/fangmanle-ai-native-pms
repo_name: sensepraxis/fangmanle-ai-native-pms
edit_uri: edit/main/

docs_dir: website
site_dir: site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Architecture: architecture.md
  - FAQ: faq.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sensepraxis/fangmanle-ai-native-pms
