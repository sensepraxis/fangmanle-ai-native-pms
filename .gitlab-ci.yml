# GitLab CI — mirrors GitHub Actions lint / test / frontend build.
# Coverage XML is produced but fail-under is not enabled (see docs/COVERAGE.md).

stages:
  - lint
  - test
  - frontend

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DATABASE_URL: "sqlite:///./tmp/ci_test.db"

backend:lint:
  stage: lint
  image: python:3.12-bookworm
  script:
    - pip install -r requirements-prod.txt
    - pip install pytest "ruff>=0.16,<0.17"
    - ruff check src
    - ruff format --check src tools
    - python tools/check_router_layer.py
    - python tools/check_spdx.py
    - python tools/i18n_catalog.py --check
    - python tools/i18n_optimize.py --check
    - python tools/check_commercial_ui.py

backend:test:
  stage: test
  image: python:3.12-bookworm
  script:
    - pip install -r requirements-prod.txt
    - pip install pytest pytest-cov
    - mkdir -p tmp
    - pytest src/tests --cov=src --cov-report=term --cov-report=xml
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml

opencore:smoke:
  stage: test
  image: python:3.12-bookworm
  variables:
    FML_COMMERCIAL: "0"
    DATABASE_URL: "sqlite:///./tmp/ci_opencore.db"
  script:
    - pip install -r requirements-prod.txt
    - pip install pytest
    - mkdir -p tmp
    - python tools/ci_opencore_smoke.py
    - pytest src/tests -q -m "not commercial"

frontend:build:
  stage: frontend
  image: node:20-bookworm
  script:
    - cd frontend
    - if [ -f package-lock.json ]; then npm ci; else npm install; fi
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm run build
