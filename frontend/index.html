<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 天地图瓦片校验 Referer；勿用 no-referrer -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>房满乐 PMS · AI 原生酒店管理系统</title>

    <!--
      Google Fonts CDN 改为异步加载 + 提供系统字体 fallback：
      - media="print" + onload 切换：浏览器把字体当作"打印样式"，不阻塞首屏渲染，
        加载完成后立即切到 all；外网不通时浏览器自动放弃 + 走系统字体栈。
      - 国内/隔离网络首屏由 src/index.css 的 font-family fallback 保证不破版。
      - 部署到内网或私有云时：如需彻底去 CDN，把下面三行 <link> 整段删掉即可。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
